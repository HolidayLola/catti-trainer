<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>德语二笔每日练 · Übersetzungswerkstatt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400;1,8..60,600&display=swap">
<link rel="stylesheet" href="style.css?v=4">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✒️</text></svg>">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Übersetzungswerkstatt<small>CATTI 德语二级笔译 · 每日训练</small></div>
    <div class="meta-row">
      <span id="issue-line"></span>
      <span>连续打卡 <b id="streak">0</b> 天 · 距考试约 <b id="cd">—</b> 天</span>
    </div>
  </header>
  <nav id="nav">
    <button data-tab="today" class="on">今日练习</button>
    <button data-tab="review">复习<span class="dot" id="due-dot" hidden></span></button>
    <button data-tab="drills">每日小卷</button>
    <button data-tab="vocab">生词本</button>
    <button data-tab="history">历史</button>
    <button data-tab="settings">设置</button>
  </nav>
  <div id="root"></div>
  <footer>
    材料每天早上约 6:45 自动更新并推送到邮箱。点德语原文中的任何单词可查<b>词源词根</b>并收入生词本。
    批改为 CATTI 扣分制：每篇 25 分，15 分及格线。数据保存在本机浏览器，可在设置中开启 GitHub 云同步。
  </footer>
</div>
<aside id="panel" hidden></aside>
<div id="toast" hidden></div>
<script src="app.js?v=4"></script>
</body>
</html>
